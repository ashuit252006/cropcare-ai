<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CropCare AI</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #e8f5e9, #f1f8e9);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 850px;
            height: 90vh;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #2e7d32, #43a047);
            color: white;
            padding: 22px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
        }

        .header p {
            margin-top: 6px;
            font-size: 14px;
        }

        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #fafafa;
        }

        .message {
            max-width: 75%;
            padding: 12px 16px;
            margin-bottom: 14px;
            border-radius: 15px;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .bot {
            background: #e8f5e9;
            color: #1b5e20;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .user {
            background: #2e7d32;
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 4px;
        }

        .input-area {
            display: flex;
            gap: 10px;
            padding: 15px;
            border-top: 1px solid #ddd;
            background: white;
        }

        #messageInput {
            flex: 1;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 12px;
            outline: none;
            font-size: 15px;
        }

        #messageInput:focus {
            border-color: #43a047;
        }

        button {
            border: none;
            background: #2e7d32;
            color: white;
            padding: 0 22px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background: #1b5e20;
        }

        .suggestions {
            padding: 10px 15px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            background: white;
        }

        .suggestion {
            border: 1px solid #81c784;
            background: #f1f8e9;
            color: #2e7d32;
            padding: 8px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
        }

        .suggestion:hover {
            background: #c8e6c9;
        }

        @media (max-width: 600px) {
            .container {
                height: 95vh;
            }

            .message {
                max-width: 90%;
            }

            .input-area {
                padding: 10px;
            }

            button {
                padding: 0 16px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>🌱 CropCare AI</h1>
        <p>Your Smart Agricultural Assistant</p>
    </div>

    <div class="suggestions">
        <div class="suggestion" onclick="askQuestion('My tomato leaves are turning yellow. What should I do?')">
            🍅 Tomato Disease
        </div>

        <div class="suggestion" onclick="askQuestion('How often should I water my rice crop?')">
            💧 Irrigation
        </div>

        <div class="suggestion" onclick="askQuestion('What is organic fertilizer?')">
            🌿 Organic Farming
        </div>

        <div class="suggestion" onclick="askQuestion('How can I improve soil fertility?')">
            🌱 Soil Health
        </div>
    </div>

    <div class="chat-box" id="chatBox">

        <div class="message bot">
            👋 Hello! I am CropCare AI.

Ask me about crops, diseases, pests, fertilizers, irrigation, soil health and farming.
        </div>

    </div>

    <div class="input-area">

        <input
            type="text"
            id="messageInput"
            placeholder="Ask your farming question..."
            onkeydown="handleKey(event)"
        >

        <button onclick="sendMessage()">Send</button>

    </div>

</div>


<script>

function addMessage(message, type) {

    const chatBox = document.getElementById("chatBox");

    const div = document.createElement("div");

    div.className = "message " + type;

    div.textContent = message;

    chatBox.appendChild(div);

    chatBox.scrollTop = chatBox.scrollHeight;
}


function askQuestion(question) {

    document.getElementById("messageInput").value = question;

    sendMessage();
}


function handleKey(event) {

    if (event.key === "Enter") {
        sendMessage();
    }

}


async function sendMessage() {

    const input = document.getElementById("messageInput");

    const message = input.value.trim();

    if (!message) {
        return;
    }

    addMessage(message, "user");

    input.value = "";

    addMessage("🌱 CropCare AI is thinking...", "bot");

    const chatBox = document.getElementById("chatBox");

    try {

        const response = await fetch("/chat", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                message: message
            })

        });

        const data = await response.json();

        // Remove thinking message
        const messages = chatBox.querySelectorAll(".message");

        if (messages.length > 0) {
            messages[messages.length - 1].remove();
        }

        addMessage(data.reply, "bot");

    } catch (error) {

        const messages = chatBox.querySelectorAll(".message");

        if (messages.length > 0) {
            messages[messages.length - 1].remove();
        }

        addMessage(
            "❌ Unable to connect to CropCare AI. Please check whether the Flask server is running.",
            "bot"
        );
    }
}

</script>

</body>
</html>
